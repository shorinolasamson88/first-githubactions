name: Multiple jobs workflow


on:
 push:
  branches: [ main ]


jobs:
 linux_check:
  runs-on: ubuntu-latest

  steps:
   - name: checking linux information
     run: |
          whoami
          pwd
          date
          uname -a
          hostname
          df -h
          free -h
          touch test-from-job1
          echo "This file is created from job 1" >> test-from-job1
          
   - name: upload artifact
     uses: actions/upload-artifact@v4
     with:
      name: my-result
      path: test-from-job1
          




 repository_check:
  needs: linux_check
  runs-on: ubuntu-latest

  steps:
   - name: Check out Repository 
     uses: actions/checkout@v4

   - name: download artifact 
     uses: actions/download-artifact@v4
     with:
      name: my-result

   - name: Checking repository information
     run: |
          tree -a
          ls -la       
          git status
          git log --oneline
          ls -l test-from-job1
          cat test-from-job1


         


     
  